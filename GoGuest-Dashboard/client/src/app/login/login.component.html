<div class="login-page">
  <div class="login-card">

    <!-- Logo -->
    <div class="brand-header">
      <div class="brand-logo">
        <img src="assets/logo.png" alt="GoGuest Logo" class="logo-img" />
      </div>
      <p class="brand-tagline">Accedi alla tua<br><strong>Dashboard di controllo.</strong></p>
    </div>

    <!-- Form Section -->
    <div class="form-section">

      <!-- Header row: Login + Crea Account -->
      <div class="form-header-row">
        <span class="form-label-title">Login</span>
        <button class="create-account-btn" (click)="onCreateAccount()" id="btn-create-account">
          Crea Account &rarr;
        </button>
      </div>

      <!-- Error message -->
      @if (errorMessage()) {
        <div class="error-banner" role="alert">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
          {{ errorMessage() }}
        </div>
      }
      @if (successMessage()) {
        <div class="success-banner" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          {{ successMessage() }}
        </div>

      }


      <!-- Email Field -->
      <div class="input-group">
        <label class="input-label" for="input-email">E-mail</label>
        <input
          id="input-email"
          type="email"
          class="input-field"
          placeholder="la tua e-mail"
          [value]="email()"
          (input)="onEmailChange($any($event.target).value)"
          (keyup.enter)="onLogin()"
          autocomplete="email"
          [disabled]="isLoading()"
        />
      </div>

      <!-- Password Field -->
      <div class="input-group">
        <label class="input-label" for="input-password">Password</label>
        <div class="password-wrapper">
          <input
            id="input-password"
            [type]="showPassword() ? 'text' : 'password'"
            class="input-field"
            placeholder="La tua password"
            [value]="password()"
            (input)="onPasswordChange($any($event.target).value)"
            (keyup.enter)="onLogin()"
            autocomplete="current-password"
            [disabled]="isLoading()"
          />
          <button
            class="toggle-password-btn"
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Nascondi password' : 'Mostra password'"
            id="btn-toggle-password"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>

      <!-- Login Button -->
      <button
        class="btn-primary"
        (click)="onLogin()"
        [disabled]="isLoading()"
        id="btn-login"
      >
        @if (isLoading()) {
          <span class="spinner"></span>
          Accesso in corso...
        } @else {
          Accedi
        }
      </button>

      <!-- Forgot Password -->
      <div class="forgot-password-row">
        <button class="forgot-password-btn" (click)="onForgotPassword()" id="btn-forgot-password">
          Password dimenticata?
        </button>
      </div>

      <!-- Divider -->
      <div class="divider">
        <span>Oppure</span>
      </div>

      <!-- Google Login -->
      <button
        class="btn-social"
        (click)="onGoogleLogin()"
        [disabled]="isLoading()"
        id="btn-google-login"
      >
        <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continua con Google
      </button>



    </div>

  </div>
</div>
