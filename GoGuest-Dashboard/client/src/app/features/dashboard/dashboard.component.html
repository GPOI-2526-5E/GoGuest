<div class="dashboard">

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <nav class="breadcrumb">
        <span>Home</span>
        <span class="sep">/</span>
        <span class="active">Dashboard</span>
      </nav>
      <h1 class="page-title">Dashboard</h1>
    </div>
    <div class="topbar-right">
      <span class="user-badge">Super Admin</span>
      <div class="avatar">SA</div>
    </div>
  </header>

  <!-- Stat Cards -->
  <section class="stats-grid">
    <div class="stat-card" *ngFor="let s of stats">
      <div class="stat-icon" [style.background]="s.bg" [style.color]="s.color">
        {{ s.icon }}
      </div>
      <div class="stat-info">
        <span class="stat-value">{{ s.value }}</span>
        <span class="stat-label">{{ s.label }}</span>
      </div>
    </div>
  </section>

  <!-- Contenuto placeholder -->
  <section class="content-area">
    <div class="empty-state">
      <span class="empty-icon">📊</span>
      <p class="empty-title">Nessun dato disponibile</p>
      <p class="empty-sub">I dati appariranno qui una volta connesso il backend.</p>
    </div>
  </section>

</div>
