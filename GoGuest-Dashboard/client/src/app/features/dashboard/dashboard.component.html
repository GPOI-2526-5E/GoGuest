<div class="dashboard">

  <!-- Stat Cards -->
  <section class="stats-grid">
    <div class="stat-card" *ngFor="let s of stats">
      <div class="stat-icon" [style.background]="s.bg" [style.color]="s.color">
        {{ s.icon }}
      </div>
      <div class="stat-info">
        <span class="stat-value">{{ s.value }}</span>
        <span class="stat-label">{{ s.label }}</span>
      </div>
    </div>
  </section>

  <section class="content-area">
    <div class="chart-panel">
      <div class="chart-header">
        <div>
          <h2>Visitatori mensili</h2>
          <p>Totale ingressi registrati da gennaio {{ currentYear }}</p>
        </div>
        <button type="button" class="refresh-btn" (click)="caricaDashboard()" [disabled]="isLoading">
          Aggiorna
        </button>
      </div>

      <div *ngIf="isLoading" class="state-message">Caricamento dati...</div>
      <div *ngIf="error && !isLoading" class="state-message error">{{ error }}</div>

      <div *ngIf="!isLoading && !error && chartData.length" class="chart-wrap">
        <div class="y-axis">
          <span>Max</span>
          <span>0</span>
        </div>

        <div class="line-chart" [class.empty-chart]="!hasMonthlyVisitors">
          <svg class="line-svg" viewBox="0 0 612 220" preserveAspectRatio="xMidYMid meet" role="img">
            <line class="grid-line" x1="32" y1="22" x2="580" y2="22"></line>
            <line class="grid-line" x1="32" y1="100" x2="580" y2="100"></line>
            <line class="grid-line base-line" x1="32" y1="178" x2="580" y2="178"></line>

            <polygon *ngIf="areaPoints" class="line-area" [attr.points]="areaPoints"></polygon>
            <polyline class="line-path" [attr.points]="linePoints"></polyline>

            <g *ngFor="let item of chartData">
              <circle class="line-point" [attr.cx]="item.x" [attr.cy]="item.y" r="5"></circle>
              <text class="point-value" [attr.x]="item.x" [attr.y]="item.y - 12">{{ item.totale }}</text>
              <text class="month-label" [attr.x]="item.x" y="212">{{ item.label }}</text>
            </g>
          </svg>
        </div>
      </div>

      <div *ngIf="!isLoading && !error && !hasMonthlyVisitors" class="empty-note">
        Nessun visitatore registrato nell'anno corrente.
      </div>
    </div>
  </section>

</div>
