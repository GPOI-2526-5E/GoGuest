<aside class="sidebar" [class.collapsed]="collapsed">

  <!-- Header brand -->
  <div class="sidebar-header">
    <div class="brand" *ngIf="!collapsed">
      <span class="brand-icon">🏨</span>
      <span class="brand-name">GoGuest</span>
    </div>
    <div class="brand brand-mini" *ngIf="collapsed">
      <span class="brand-icon">🏨</span>
    </div>
    <button class="collapse-btn" id="sidebar-collapse-btn" (click)="toggleCollapse()" [title]="collapsed ? 'Espandi' : 'Comprimi'">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        [style.transform]="collapsed ? 'rotate(180deg)' : 'rotate(0deg)'">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
  </div>

  <!-- Nav items -->
  <nav class="sidebar-nav">
    <ul>
      <li *ngFor="let item of navItems">

        <!-- Item senza figli -->
        <a *ngIf="!item.children"
          class="nav-item"
          [class.active]="isActive(item.path)"
          [routerLink]="item.path"
          [id]="'nav-' + item.label.toLowerCase()"
          [title]="collapsed ? item.label : ''"
        >
          <span class="nav-icon" [innerHTML]="item.icon"></span>
          <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
        </a>

        <!-- Item con figli (gruppo) -->
        <div *ngIf="item.children" class="nav-group">
          <button
            class="nav-item nav-group-toggle"
            [class.active]="isGroupActive(item)"
            [class.open]="isGroupOpen(item.label)"
            (click)="toggleGroup(item.label)"
            [id]="'nav-group-' + item.label.toLowerCase()"
            [title]="collapsed ? item.label : ''"
          >
            <span class="nav-icon" [innerHTML]="item.icon"></span>
            <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
            <svg *ngIf="!collapsed" class="chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>

          <!-- Sub-items -->
          <ul class="sub-menu" *ngIf="!collapsed && isGroupOpen(item.label)">
            <li *ngFor="let child of item.children">
              <a
                class="sub-item"
                [class.active]="isActive(child.path)"
                [routerLink]="child.path"
                [id]="'nav-' + child.label.toLowerCase()"
              >
                <span class="sub-dot"></span>
                {{ child.label }}
              </a>
            </li>
          </ul>
        </div>

      </li>
    </ul>
  </nav>

  <!-- Footer versione -->
  <div class="sidebar-footer" *ngIf="!collapsed">
    <span class="version">v1.0.0 · API v1.0</span>
  </div>

</aside>
